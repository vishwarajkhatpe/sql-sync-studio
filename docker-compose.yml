version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    container_name: sql_sync_backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=your_production_secret_key_change_me
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - ENCRYPTION_KEY=your-32-byte-base64-secret-key-goes-here123=
      - DATABASE_URL=sqlite:///./sql_app.db
    volumes:
      - ./backend/sql_app.db:/app/sql_app.db
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: sql_sync_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always
